[package]
name = "betterbase-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Betterbase crypto, auth, discovery, and sync"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
betterbase-crypto = { path = "../betterbase-crypto" }
betterbase-auth = { path = "../betterbase-auth" }
betterbase-discovery = { path = "../betterbase-discovery" }
betterbase-sync-core = { path = "../betterbase-sync-core" }
betterbase-file-store = { path = "../betterbase-file-store" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
ciborium = "0.2"
zeroize = "1"
sha2 = "0.11"

# See crates/betterbase-db-wasm/Cargo.toml for why wasm-opt stays off:
# stale cached binaryen crashes on modern rustc output, and its transforms
# grow the compressed wire size we actually serve.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
