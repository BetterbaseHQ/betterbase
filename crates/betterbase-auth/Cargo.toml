[package]
name = "betterbase-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PKCE, JWE decryption, JWT payload decoding, JWK thumbprint, and scoped key extraction"

[dependencies]
betterbase-crypto = { path = "../betterbase-crypto" }
aes-gcm = { version = "0.11", features = ["zeroize"] }
aes-kw = { version = "0.3", features = ["zeroize"] }
base64ct = { version = "1", features = ["alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hkdf = "0.13"
hex = "0.4"
p256 = { version = "0.14", features = ["ecdh", "getrandom"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
